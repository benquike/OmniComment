<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Outer Omni Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="omniGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glassmorphic Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Subtle Top Highlight -->
  <path d="M 28 68 C 28 44, 44 28, 68 28 L 188 28 C 120 28, 28 76, 28 140 Z" fill="#FFFFFF" opacity="0.04" />

  <!-- Outer Luminous Omni Loop -->
  <g filter="url(#omniGlow)">
    <circle cx="128" cy="124" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="11" stroke-linecap="round" stroke-dasharray="390 90" stroke-dashoffset="25" />
  </g>

  <!-- Comment Thread Box (Glassmorphic Card) -->
  <g filter="url(#cardShadow)">
    <!-- Outer Glass Border -->
    <path d="M 72 78 
             C 72 66, 82 56, 94 56 
             L 162 56 
             C 174 56, 184 66, 184 78 
             L 184 136 
             C 184 148, 174 158, 162 158 
             L 114 158 
             L 84 182 
             L 92 158 
             C 80 158, 72 148, 72 136 
             Z" 
          fill="url(#glassGrad)" 
          stroke="rgba(255, 255, 255, 0.35)" 
          stroke-width="2" />

    <!-- Dark Inner Bubble Surface -->
    <path d="M 78 80 
             C 78 70, 86 62, 96 62 
             L 160 62 
             C 170 62, 178 70, 178 80 
             L 178 134 
             C 178 144, 170 152, 160 152 
             L 116 152 
             L 94 170 
             L 100 152 
             C 88 152, 78 144, 78 134 
             Z" 
          fill="#131B2E" 
          opacity="0.92" />
  </g>

  <!-- Thread Content / Discussion Lines -->
  <!-- Line 1: Primary Comment (Electric Blue) -->
  <rect x="98" y="84" width="60" height="7" rx="3.5" fill="#38BDF8" />
  
  <!-- Line 2: Nested Reply (Violet) -->
  <rect x="108" y="102" width="46" height="7" rx="3.5" fill="#818CF8" />
  
  <!-- Line 3: AI Resolution Spark (Pink / Rose) -->
  <rect x="108" y="120" width="30" height="7" rx="3.5" fill="#F472B6" />

  <!-- AI Sparkle Icon (Top Right) -->
  <g filter="url(#omniGlow)">
    <path d="M 166 66 Q 166 74 174 74 Q 166 74 166 82 Q 166 74 158 74 Q 166 74 166 66 Z" fill="#FCD34D" />
  </g>
</svg>
